spring:
  application:
    name: smart-issue-tracker
  threads:
    virtual:
      # O dimensionamento do pool HikariCP deve ser reavaliado à luz dos resultados da Fase 8,
      # caso os testes de carga revelem esgotamento de ligações — conforme registado em
      # docs/adr/adr-04-virtual-threads.md, secção "Consequências / Negativas".
      enabled: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    placeholders:
      admin_password_hash: ${ADMIN_BOOTSTRAP_PASSWORD_HASH:$2b$10$EX0/eIBKN7WrlNZdwG/g7eHjqlD/0NWnev0ivfq4D1sGmiADgcgNe}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: issue-classification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.teuprojecto.tracker.issue.domain.event

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:de2b72a8e9c4f61d3a5b8c0d9e7f4a2b6c8d0e1f3a5b7c9d1e3f5a7b9c0d2e4}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
